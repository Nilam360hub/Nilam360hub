<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Nilam360 — நிர்வாகி / Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#123a63;--navy-deep:#0a2542;--green:#3f9142;--green-light:#7cc242;--amber:#f0a323;--paper:#f4f7fa;--ink:#15212f;--line:rgba(18,58,99,.14);--red:#a1442b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans Tamil','Inter',sans-serif;font-size:14.5px;line-height:1.5;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;background:var(--navy);color:#fff;}
  .btn.green{background:var(--green);} .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);} .btn.red{background:var(--red);}
  .btn:disabled{opacity:.55;cursor:default;}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#fff;color:var(--ink);width:100%;}

  /* login */
  #loginView{min-height:100vh;display:grid;place-items:center;background:linear-gradient(155deg,var(--navy-deep),var(--navy) 62%,#1a5c3f);padding:20px;}
  .login-card{background:#fff;border-radius:16px;padding:34px 30px;width:100%;max-width:400px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
  .login-card img{height:64px;margin:0 auto 10px;display:block;}
  .login-card h1{margin:0 0 4px;font-size:21px;text-align:center;color:var(--navy);}
  .login-card p.sub{margin:0 0 22px;text-align:center;color:#5c6773;font-size:13px;}
  .login-card label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 6px;color:#3a4451;}
  .login-card .btn{width:100%;margin-top:20px;padding:12px;}
  .msg{margin-top:14px;font-size:13.5px;} .msg.err{color:var(--red);} .msg.ok{color:var(--green);}
  .back{display:block;text-align:center;margin-top:18px;font-size:13px;color:#5c6773;text-decoration:none;}

  /* app */
  .topbar{background:var(--navy-deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;gap:14px;position:sticky;top:0;z-index:20;}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;}
  .topbar .brand img{height:36px;background:#fff;border-radius:6px;padding:2px;}
  .topbar .brand b{color:var(--green-light);} .topbar small{opacity:.7;font-weight:400;}
  .topbar .who{display:flex;align-items:center;gap:12px;font-size:13px;}
  .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px);}
  .side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;}
  .side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--ink);}
  .side button:hover{background:var(--paper);} .side button.on{background:var(--navy);color:#fff;font-weight:600;}
  .side .pill{background:var(--amber);color:#3b2600;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 4px;}
  main{padding:22px;min-width:0;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .bar h2{margin:0 auto 0 0;font-size:20px;color:var(--navy);} .bar input{max-width:260px;} .bar select{max-width:190px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;}
  .card .num{font-size:30px;font-weight:700;color:var(--navy);} .card .lbl{font-size:12.5px;color:#5c6773;}
  .card.hot .num{color:var(--green);}
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{border-collapse:collapse;width:100%;min-width:700px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;}
  th{background:#eef3f6;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#3a4451;position:sticky;top:0;}
  tbody tr{cursor:pointer;} tbody tr:hover{background:#f3f8f4;}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e8eef4;color:var(--navy);}
  .tag.good{background:#e3f3e4;color:#2a6b2d;} .tag.warn{background:#fdf0d5;color:#8a5a00;} .tag.bad{background:#f8e2dc;color:var(--red);}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;color:#5c6773;}
  .empty{padding:40px;text-align:center;color:#5c6773;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,37,66,.55);display:flex;justify-content:flex-end;z-index:50;}
  .panel{background:#fff;width:min(620px,100%);height:100%;overflow:auto;padding:22px;}
  .panel h3{margin:0 0 4px;color:var(--navy);} .panel .hint{font-size:12.5px;color:#5c6773;margin-bottom:14px;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;} .fgrid .full{grid-column:1/-1;}
  .fgrid label{display:block;font-size:11.5px;font-weight:600;color:#3a4451;margin-bottom:4px;word-break:break-all;}
  .fgrid label i{color:var(--red);font-style:normal;}
  .fgrid input[readonly]{background:#f1f4f7;color:#5c6773;}
  .actions{position:sticky;bottom:-22px;background:#fff;padding:14px 0 6px;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:9px;z-index:99;font-size:14px;max-width:90%;}
  .toast.err{background:var(--red);}
  @media (max-width:820px){.layout{grid-template-columns:1fr;} .side{display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line);} .side button{white-space:nowrap;width:auto;gap:8px;} .side hr{display:none;} .fgrid{grid-template-columns:1fr;} .topbar small{display:none;}}
</style>
</head>

    if (isStatus || col === 'requirement_type') return '<span class="tag ' + tagClass(v) + '">' + esc(v) + '</span>';
    if (typeof v === 'number' && /price|value|budget|investment|share/.test(col)) return esc(v.toLocaleString('en-IN'));

          '<select id="brkSelNew" style="flex:2;min-width:160px;"><option value="">தரகர்கள் ஏற்றப்படுகிறது…</option></select>' +
          '<select id="brkRoleNew" style="flex:1;min-width:120px;"><option>Primary</option><option>Co-Broker</option><option>Referral</option><option>Sub-Broker</option></select>' +
          '</div><p class="hint" style="margin:6px 0 0;">"சேமி" அழுத்தும்போது இந்த தரகருடன் தானாக இணைக்கப்படும்.</p></div>';
      }
      root.innerHTML = '<div class="overlay" id="ov"><form class="panel" id="rf"><h3>' + esc(cfg.label) + '</h3><div class="hint">' + (isNew ? 'புதிய பதிவு' : esc(row[cfg.pk])) + '</div>' +
        '<div class="fgrid">' + fields + idDistrictField + photoSection + brokerSection + activitySection + '</div><p class="msg err" id="rmsg"></p>' +
        '<div class="actions"><button class="btn green" type="submit">சேமி</button>' +
        (canConvert ? '<button class="btn" type="button" id="convBtn">➜ Record ஆக மாற்று</button>' : '') +
        '<button class="btn ghost" type="button" id="cancelBtn">மூடு</button></div></form></div>';
      $('#ov').addEventListener('mousedown', function (e) { if (e.target.id === 'ov') root.innerHTML = ''; });
      $('#cancelBtn').addEventListener('click', function () { root.innerHTML = ''; });

      // district -> taluk cascade
      $('#rf').querySelectorAll('select[data-district-for]').forEach(function (dSel) {
        var talukName = dSel.getAttribute('data-district-for');
        var tSel = $('#rf').querySelector('select[name="' + talukName + '"]');
        function fillTaluk(preselect) {
          if (!tSel) return;
          var list = taluksByDistrict[dSel.value] || [];
          tSel.innerHTML = '<option value="">' + (dSel.value ? 'வட்டத்தை தேர்வு செய்க' : 'முதலில் மாவட்டம் தேர்வு செய்க') + '</option>' +
            list.map(function (t) { return '<option' + (t === preselect ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
        }
        fillTaluk(isNew ? '' : row[talukName]);
        dSel.addEventListener('change', function () { fillTaluk(''); });
      });

      // district-coded ID: regenerate the ID as soon as the relevant district is chosen
      if (idIsCoded) {
        var idFieldSel = (cur === 'brokers') ? $('#brkDistrictForId') : $('#rf').querySelector('select[name="' + ID_DISTRICT_FIELD[cur] + '"]');
        var pkInput = $('#pkAutoField');
        if (idFieldSel && pkInput) {
          idFieldSel.addEventListener('change', function () {
            if (!idFieldSel.value) { pkInput.value = cfg.prefix + '-???'; return; }
            pkInput.value = cfg.prefix + '-' + districtCode(idFieldSel.value) + '-…';
            nextIdCoded(cfg, districtCode(idFieldSel.value)).then(function (id) { pkInput.value = id; });
            if (cur === 'brokers') {
              var areaEl = $('#rf').elements['area'];
              if (areaEl && !areaEl.value.trim()) areaEl.value = idFieldSel.value;
            }
          });
        }
      }

      // activity / follow-up logging (buyers, investors, requirements, properties)
      if (['buyers', 'investors', 'requirements', 'properties'].indexOf(cur) !== -1 && !isNew) {
        var actList = $('#actList');
        function actKeyFor() {
          if (cur === 'properties') return { property_id: row.property_id, person_entity_id: null, person_type: null };
          if (cur === 'requirements') return { property_id: null, person_entity_id: row.person_entity_id, person_type: row.requirement_type, requirement_id: row.requirement_id };
          return { property_id: null, person_entity_id: row[cfg.pk], person_type: ACT_PERSON_TYPE[cur] };
        }
        function loadActs() {
          var k = actKeyFor();
          var q = sb.from('activity_log').select('*').order('activity_date', { ascending: false }).limit(5);
          q = k.property_id ? q.eq('property_id', k.property_id) : q.eq('person_entity_id', k.person_entity_id);
          q.then(function (r) {
            var rows = r.data || [];
            actList.innerHTML = rows.length ? ('சமீபத்திய பதிவுகள்: ' + rows.map(function (a) {
              return esc(a.activity_date) + ' — ' + esc(a.activity_type) + (a.outcome ? (': ' + esc(a.outcome)) : '') + (a.next_followup ? (' (அடுத்தது: ' + esc(a.next_followup) + ')') : '');
            }).join('<br>')) : 'இதுவரை பதிவு இல்லை.';
          });
        }
        loadActs();
        $('#actSaveBtn').addEventListener('click', function () {
          var k = actKeyFor();
          var payload = {
            activity_id: 'ACT' + Date.now() + Math.random().toString(36).slice(2, 6),
            activity_date: new Date().toISOString().slice(0, 10),
            activity_type: $('#actType').value,
            outcome: $('#actOutcome').value || null,
            next_followup: $('#actNextDate').value || null,
            priority: $('#actPriority').value || null,
            property_id: k.property_id, person_entity_id: k.person_entity_id, person_type: k.person_type,
            requirement_id: k.requirement_id || null
          };
          sb.from('activity_log').insert([payload]).then(function (r) {
            if (r.error) { toast(r.error.message, true); return; }
            toast('பதிவு சேமிக்கப்பட்டது ✔'); $('#actOutcome').value = ''; $('#actNextDate').value = ''; loadActs();
          });
        });
      }

      // photo upload (properties + layout_projects, existing records)
      if (PHOTO_CFG[cur] && !isNew) {
        var pcfg = PHOTO_CFG[cur];
        var photoInput = $('#photoFileInput'), photoStatus = $('#photoUploadStatus'), photoThumbs = $('#photoThumbs');
        function renderThumbs(urls) {
          photoThumbs.innerHTML = urls.map(function (url, i) {
            return '<div style="position:relative;"><img src="' + esc(url) + '" style="width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">' +
              '<a href="#" data-rm-photo="' + i + '" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;">✕</a></div>';
          }).join('');
          photoThumbs.querySelectorAll('[data-rm-photo]').forEach(function (a) {
            a.addEventListener('click', function (e) {
              e.preventDefault();
              var idx = Number(a.dataset.rmPhoto);
              var next = urls.slice(0, idx).concat(urls.slice(idx + 1));
              sb.from(cur).update({ photo_urls: next }).eq(pcfg.pk, row[pcfg.pk]).then(function (r) {
                if (r.error) { toast(r.error.message, true); return; }
                row.photo_urls = next; renderThumbs(next); toast('புகைப்படம் நீக்கப்பட்டது ✔');
              });
            });
          });
        }
        renderThumbs(row.photo_urls || []);
        photoInput.addEventListener('change', function () {
          var files = Array.from(photoInput.files || []);
          if (!files.length) return;
          photoStatus.textContent = 'பதிவேற்றுகிறது…';
          var uploads = files.map(function (file) {
            var path = pcfg.prefix + row[pcfg.pk] + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            return sb.storage.from(pcfg.bucket).upload(path, file).then(function (r) {
              if (r.error) throw r.error;
              return sb.storage.from(pcfg.bucket).getPublicUrl(path).data.publicUrl;
            });
          });
          Promise.all(uploads).then(function (newUrls) {
            var merged = (row.photo_urls || []).concat(newUrls);
            return sb.from(cur).update({ photo_urls: merged }).eq(pcfg.pk, row[pcfg.pk]).then(function (r) {
              if (r.error) throw r.error;
              row.photo_urls = merged; renderThumbs(merged);
              photoStatus.textContent = ''; photoInput.value = ''; toast('புகைப்படங்கள் சேர்க்கப்பட்டன ✔');
            });
          }).catch(function (err) {
            photoStatus.textContent = ''; toast('பதிவேற்றம் தோல்வி: ' + (err.message || err), true);
          });
        });
      }

      // broker linking (properties only, existing records)
      if (cur === 'properties' && !isNew) {
        var brkBox = $('#brokerLinks'), brkSel = $('#brkSel'), brkAdd = $('#brkAddBtn');
        function loadLinks() {
          Promise.all([
            sb.from('property_brokers').select('link_id,broker_id,broker_role,brokers(full_name)').eq('property_id', row.property_id),
            sb.from('brokers').select('broker_id,full_name').eq('status', 'Active').order('full_name')
          ]).then(function (r) {
            var links = (r[0].data || []), allBrokers = (r[1].data || []);
            brkBox.innerHTML = links.length ? links.map(function (l) {
              return '<span class="tag" style="margin:2px 6px 2px 0;">' + esc((l.brokers && l.brokers.full_name) || l.broker_id) + ' — ' + esc(l.broker_role) +
                ' <a href="#" data-unlink="' + l.link_id + '" style="color:var(--red);margin-left:4px;">✕</a></span>';
            }).join('') : 'இணைக்கப்பட்ட தரகர் இல்லை.';
            brkBox.querySelectorAll('[data-unlink]').forEach(function (a) {
              a.addEventListener('click', function (e) {
                e.preventDefault();
                if (!confirm('இந்த தரகர் இணைப்பை நீக்கவா?')) return;
                sb.from('property_brokers').delete().eq('link_id', a.dataset.unlink).then(function () { loadLinks(); });
              });
            });
            var already = links.map(function (l) { return l.broker_id; });
            brkSel.innerHTML = '<option value="">தரகரைத் தேர்வு செய்க…</option>' + allBrokers.filter(function (b) { return already.indexOf(b.broker_id) === -1; })
              .map(function (b) { return '<option value="' + esc(b.broker_id) + '">' + esc(b.full_name) + ' (' + esc(b.broker_id) + ')</option>'; }).join('');
          });
        }
        loadLinks();
        brkAdd.addEventListener('click', function () {
          if (!brkSel.value) return;
          brkAdd.disabled = true;
          sb.from('property_brokers').insert([{ property_id: row.property_id, broker_id: brkSel.value, broker_role: $('#brkRole').value }]).then(function (r) {
            brkAdd.disabled = false;
            if (r.error) { toast(r.error.message, true); return; }
            toast('தரகர் இணைக்கப்பட்டார் ✔'); loadLinks();
          });
        });
      } else if (cur === 'properties' && isNew) {
        sb.from('brokers').select('broker_id,full_name').eq('status', 'Active').order('full_name').then(function (r) {
          var sel = $('#brkSelNew'); if (!sel) return;
          var allBrokers = r.data || [];
          sel.innerHTML = '<option value="">தரகரைத் தேர்வு செய்க… (விருப்பம்)</option>' +
            allBrokers.map(function (b) { return '<option value="' + esc(b.broker_id) + '">' + esc(b.full_name) + ' (' + esc(b.broker_id) + ')</option>'; }).join('');
        });
      }

      var cb = $('#convBtn');
      if (cb) cb.addEventListener('click', function () {
        if (!confirm('இந்த விசாரணையை ' + row.requirement_type + ' record ஆக மாற்றவா?' + (row.requirement_type === 'Seller' ? '\n(Owner + Property "Draft" ஆக உருவாகும் — இணையதளத்தில் தெரியாது.)' : ''))) return;
        cb.disabled = true;
        sb.rpc('promote_enquiry', { p_id: row.id }).then(function (r) {
          if (r.error) { cb.disabled = false; $('#rmsg').textContent = r.error.message; return; }
          root.innerHTML = ''; toast('உருவாக்கப்பட்டது: ' + r.data); openTab(cur);
        });
      });
      $('#rf').addEventListener('submit', function (e) {
        e.preventDefault();
        if (idIsCoded && $('#pkAutoField').value.indexOf('?') !== -1) {
          $('#rmsg').textContent = 'ID உருவாக, முதலில் மாவட்டத்தைத் தேர்ந்தெடுக்கவும்.'; return;
        }
        var payload = {}, f = $('#rf');
        cols.forEach(function (c) {
          if (c.ro || c.t === 'ts') return;
          if (!isNew && c.pk) return;
          var el = f.elements[c.n]; if (!el || el.disabled) return;
          var v = el.value.trim();
          if (isNew && v === '') return;                       // let DB defaults apply
          if (c.t === 'arr') {
            var arr = v.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            payload[c.n] = arr.length ? arr : null;
          } else if (v === '') payload[c.n] = null;
          else payload[c.n] = c.t === 'num' ? Number(v) : v;
        });
        if (!isNew) {                                          // send only what changed
          Object.keys(payload).forEach(function (k) { var o = row[k]; if ((o == null ? null : String(o)) === (payload[k] == null ? null : String(payload[k]))) delete payload[k]; });
          if (!Object.keys(payload).length) { root.innerHTML = ''; return; }
        }
        var newBrokerId = (cur === 'properties' && isNew && $('#brkSelNew')) ? $('#brkSelNew').value : '';
        var newBrokerRole = (cur === 'properties' && isNew && $('#brkRoleNew')) ? $('#brkRoleNew').value : 'Primary';
        var qy = isNew ? sb.from(cur).insert([payload]) : sb.from(cur).update(payload).eq(cfg.pk, row[cfg.pk]);
        qy.then(function (r) {
          if (r.error) { $('#rmsg').textContent = r.error.message; return; }
          if (newBrokerId) {
            sb.from('property_brokers').insert([{ property_id: payload.property_id, broker_id: newBrokerId, broker_role: newBrokerRole }]).then(function (br) {
              root.innerHTML = '';
              toast(br.error ? ('சொத்து சேமிக்கப்பட்டது ✔ (தரகர் இணைப்பு தோல்வி: ' + br.error.message + ')') : 'சொத்து சேமிக்கப்பட்டு, தரகருடன் இணைக்கப்பட்டது ✔', !!br.error);
              openTab(cur);
            });
          } else {
            root.innerHTML = ''; toast('சேமிக்கப்பட்டது ✔'); openTab(cur);
          }
        });
      });
    }
    if (isNew && cfg.prefix && ID_DISTRICT_FIELD[cur] && districtsLoaded) build();
    else if (isNew && cfg.prefix) nextId(cfg).then(build);
    else build();
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('#modalRoot').innerHTML = ''; });
})();
</script>
</body>
</html>
