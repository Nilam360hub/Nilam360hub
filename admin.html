<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Nilam360 — நிர்வாகி / Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#123a63;--navy-deep:#0a2542;--green:#3f9142;--green-light:#7cc242;--amber:#f0a323;--paper:#f4f7fa;--ink:#15212f;--line:rgba(18,58,99,.14);--red:#a1442b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans Tamil','Inter',sans-serif;font-size:14.5px;line-height:1.5;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;background:var(--navy);color:#fff;}
  .btn.green{background:var(--green);} .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);} .btn.red{background:var(--red);}
  .btn:disabled{opacity:.55;cursor:default;}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#fff;color:var(--ink);width:100%;}

  /* login */
  #loginView{min-height:100vh;display:grid;place-items:center;background:linear-gradient(155deg,var(--navy-deep),var(--navy) 62%,#1a5c3f);padding:20px;}
  .login-card{background:#fff;border-radius:16px;padding:34px 30px;width:100%;max-width:400px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
  .login-card img{height:64px;margin:0 auto 10px;display:block;}
  .login-card h1{margin:0 0 4px;font-size:21px;text-align:center;color:var(--navy);}
  .login-card p.sub{margin:0 0 22px;text-align:center;color:#5c6773;font-size:13px;}
  .login-card label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 6px;color:#3a4451;}
  .login-card .btn{width:100%;margin-top:20px;padding:12px;}
  .msg{margin-top:14px;font-size:13.5px;} .msg.err{color:var(--red);} .msg.ok{color:var(--green);}
  .back{display:block;text-align:center;margin-top:18px;font-size:13px;color:#5c6773;text-decoration:none;}

  /* app */
  .topbar{background:var(--navy-deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;gap:14px;position:sticky;top:0;z-index:20;}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;}
  .topbar .brand img{height:36px;background:#fff;border-radius:6px;padding:2px;}
  .topbar .brand b{color:var(--green-light);} .topbar small{opacity:.7;font-weight:400;}
  .topbar .who{display:flex;align-items:center;gap:12px;font-size:13px;}
  .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px);}
  .side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;}
  .side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--ink);}
  .side button:hover{background:var(--paper);} .side button.on{background:var(--navy);color:#fff;font-weight:600;}
  .side .pill{background:var(--amber);color:#3b2600;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 4px;}
  .gov-links{background:#fff;border-right:1px solid var(--line);padding:4px 10px 16px;}
  .gov-links h5{margin:6px 12px 8px;font-size:11px;letter-spacing:.04em;color:#8a94a1;text-transform:uppercase;}
  .gov-links a{display:flex;align-items:center;gap:8px;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:13px;color:#3a4451;}
  .gov-links a:hover{background:var(--paper);color:var(--navy);}
  .gov-links a svg{width:14px;height:14px;flex-shrink:0;color:#8a94a1;}
  @media (max-width:820px){.gov-links{display:none;}}
  main{padding:22px;min-width:0;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .bar h2{margin:0 auto 0 0;font-size:20px;color:var(--navy);} .bar input{max-width:260px;} .bar select{max-width:190px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;}
  .card .num{font-size:30px;font-weight:700;color:var(--navy);} .card .lbl{font-size:12.5px;color:#5c6773;}
  .card.hot .num{color:var(--green);}
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{border-collapse:collapse;width:100%;min-width:700px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;}
  th{background:#eef3f6;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#3a4451;position:sticky;top:0;}
  tbody tr{cursor:pointer;} tbody tr:hover{background:#f3f8f4;}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e8eef4;color:var(--navy);}
  .tag.good{background:#e3f3e4;color:#2a6b2d;} .tag.warn{background:#fdf0d5;color:#8a5a00;} .tag.bad{background:#f8e2dc;color:var(--red);}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;color:#5c6773;}
  .empty{padding:40px;text-align:center;color:#5c6773;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,37,66,.55);display:flex;justify-content:flex-end;z-index:50;}
  .panel{background:#fff;width:min(620px,100%);height:100%;overflow:auto;padding:22px;}
  .panel h3{margin:0 0 4px;color:var(--navy);} .panel .hint{font-size:12.5px;color:#5c6773;margin-bottom:14px;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;} .fgrid .full{grid-column:1/-1;}
  .fgrid label{display:block;font-size:11.5px;font-weight:600;color:#3a4451;margin-bottom:4px;word-break:break-all;}
  .fgrid label i{color:var(--red);font-style:normal;}
  .fgrid input[readonly]{background:#f1f4f7;color:#5c6773;}
  .actions{position:sticky;bottom:-22px;background:#fff;padding:14px 0 6px;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:9px;z-index:99;font-size:14px;max-width:90%;}
  .toast.err{background:var(--red);}

  /* bulk plot add */
  .panel.wide{width:min(900px,100%);}
  .bulk-step{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;}
  .bulk-step h4{margin:0 0 6px;font-size:14px;color:var(--navy);}
  .bulk-textarea{width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical;}
  .bulk-preview-wrap{margin-top:10px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .bulk-preview-wrap table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .bulk-preview-wrap th, .bulk-preview-wrap td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  .bulk-preview-wrap th{background:var(--paper);position:sticky;top:0;}
  .bulk-count{font-size:13px;font-weight:600;color:var(--navy);margin-top:8px;}
  .bulk-count.warn{color:var(--red);}
  @media (max-width:820px){.layout{grid-template-columns:1fr;} .side{display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line);} .side button{white-space:nowrap;width:auto;gap:8px;} .side hr{display:none;} .fgrid{grid-template-columns:1fr;} .topbar small{display:none;}}
</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="loginView">
  <form class="login-card" id="loginForm">
    <img src="logo.png" alt="Nilam360">
    <h1>நிர்வாகி உள்நுழைவு</h1>
    <p class="sub">Nilam360 Admin — அங்கீகரிக்கப்பட்டவர்களுக்கு மட்டும்</p>
    <label for="em">மின்னஞ்சல் / Email</label>
    <input id="em" type="email" required autocomplete="username">
    <label for="pw">கடவுச்சொல் / Password</label>
    <input id="pw" type="password" required autocomplete="current-password">
    <button class="btn" id="loginBtn" type="submit">உள்நுழை</button>
    <p class="msg" id="loginMsg" role="alert"></p>
    <a class="back" href="index.html">&larr; இணையதளத்திற்கு திரும்ப</a>
  </form>
</div>

      <nav class="side" id="side"></nav>
      <div class="gov-links">

        <a href="https://tnreginet.gov.in/portal/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg> வழிகாட்டு மதிப்பு</a>

</div>

  function tagClass(v) {
    v = String(v || '').toLowerCase();
    if (/^(verified|listed|converted|closed|paid|active|signed|investment ready)/.test(v)) return 'good';
    if (/(pending|new|draft|progress|submitted|part|open|raw|negotiation)/.test(v)) return 'warn';
    if (/(reject|failed|spam|blacklist|suspend|cancel|dispute|litigation|lost)/.test(v)) return 'bad';
    return '';
  }
  function fmt(col, v) {
    if (v == null || v === '') return '';
    if (col === 'submitted_at') return esc(new Date(v).toLocaleString('en-IN'));
    if (typeof v === 'boolean') return '<span class="tag ' + (v ? 'good' : '') + '">' + (v ? 'Yes' : 'No') + '</span>';
    var isStatus = /status$|^priority$|role$|_type$/.test(col) && !/^(property_type|document_type|transaction_type|activity_type|verification_type|requirement_type)$/.test(col);
    if (isStatus || col === 'requirement_type') return '<span class="tag ' + tagClass(v) + '">' + esc(v) + '</span>';
    if (typeof v === 'number' && /price|value|budget|investment|share/.test(col)) return esc(v.toLocaleString('en-IN'));
    return esc(v);
  }

  function csv(list) {
    var cols = META[cur].map(function (c) { return c.n; });
    var lines = [cols.join(',')].concat(list.map(function (r) {
      return cols.map(function (c) { var v = r[c] == null ? '' : String(r[c]); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
    }));
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = cur + '_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  }

        '<div><label>Highlight</label>' + bulkSel('bHighlight', HILITE_E) + '</div>' +
        '<div><label>உரிமையாளர் ID (Owner ID) — தெரிந்தால்</label><input id="bOwnerId"></div>' +
        '<div class="full"><label>Amenities</label><input id="bAmenities"><p class="hint" style="margin:4px 0 0;">காற்புள்ளியால் பிரிக்கவும் — எ.கா. Road Access, Electricity, Water Supply, Park</p></div>' +
        '</div></div>' +

        '<div class="bulk-step"><h4>2️⃣ இயல்பு (Default) பரப்பளவு &amp; விலை — விருப்பம்</h4>' +
        '<div class="hint">கீழே பட்டியலில் எல்லா பிளாட்டுக்கும் தனித்தனி பரப்பளவு/விலை கொடுக்கலாம். ஒரே அளவு/விலை என்றால் இங்கே ஒரு முறை நிரப்பினால் போதும் — கீழே Plot No மட்டும் பட்டியலிடலாம்.</div>' +
        '<div class="fgrid">' +
        '<div><label>அளவு அலகு (Unit)</label>' + bulkSel('bExtUnit', EXTUNIT_E, 'Sq.ft') + '</div>' +
        '<div><label>இயல்பு பரப்பளவு</label><input id="bDefExtent" type="number" step="any"></div>' +
        '<div><label>இயல்பு விலை (₹)</label><input id="bDefPrice" type="number" step="any"></div>' +
        '<div><label>சாலை அகலம் (அடி)</label><input id="bRoadWidth" type="number" step="any"></div>' +
        '</div></div>' +

        '<div class="bulk-step"><h4>3️⃣ ஒவ்வொரு பிளாட்டின் விவரம் <i style="color:var(--red);font-style:normal;">*</i></h4>' +
        '<div class="hint">ஒரு வரிக்கு ஒரு பிளாட். Excel-இலிருந்து நேரடியாக ஒட்டலாம் (Tab-ஆல் பிரிக்கப்பட்டது), அல்லது காற்புள்ளியால் பிரித்து டைப் செய்யலாம்:<br>' +
        '<b>Plot No</b> மட்டும் — அல்லது — <b>Plot No, பரப்பளவு</b> — அல்லது — <b>Plot No, பரப்பளவு, விலை</b><br>எ.கா:<br>' +
        '<code>12, 2400, 1850000</code><br><code>13, 2600, 2000000</code><br><code>14</code> (இயல்பு பரப்பளவு/விலை பயன்படுத்தப்படும்)</div>' +
        '<textarea id="bRows" class="bulk-textarea" rows="10" placeholder="12, 2400, 1850000&#10;13, 2600, 2000000&#10;14, 2400, 1850000"></textarea>' +
        '<div class="bulk-count" id="bCount">0 பிளாட்கள் தயார்</div>' +
        '<div class="bulk-preview-wrap" id="bPreviewWrap" style="display:none;"><table><thead><tr><th>Survey/Plot No</th><th>பரப்பளவு</th><th>விலை</th></tr></thead><tbody id="bPreviewBody"></tbody></table></div>' +
        '</div>' +

        '<p class="msg err" id="bmsg"></p>' +
        '<div class="actions"><button class="btn green" type="submit" id="bSaveBtn">எல்லாம் சேமி</button><button class="btn ghost" type="button" id="bCancelBtn">மூடு</button></div>' +
        '</form></div>';

      $('#ov2').addEventListener('mousedown', function (e) { if (e.target.id === 'ov2') root.innerHTML = ''; });
      $('#bCancelBtn').addEventListener('click', function () { root.innerHTML = ''; });

      $('#bDistrict').addEventListener('change', function () {
        var list = taluksByDistrict[this.value] || [];
        $('#bTaluk').innerHTML = '<option value="">' + (this.value ? 'வட்டத்தை தேர்வு செய்க' : 'முதலில் மாவட்டம் தேர்வு செய்க') + '</option>' +
          list.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
      });

      function parseRows() {
        var raw = $('#bRows').value;
        var lines = raw.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
        var defExtent = $('#bDefExtent').value.trim();
        var defPrice = $('#bDefPrice').value.trim();
        var out = [], bad = [];
        lines.forEach(function (line, idx) {
          var parts = line.indexOf('\t') !== -1 ? line.split('\t') : line.split(',');
          parts = parts.map(function (p) { return p.trim(); }).filter(function (p, i) { return i === 0 || p !== ''; });
          var plotNo = parts[0];
          var extent = parts[1] !== undefined && parts[1] !== '' ? parts[1] : defExtent;
          var price = parts[2] !== undefined && parts[2] !== '' ? parts[2] : defPrice;
          if (!plotNo) { bad.push(idx + 1); return; }
          if (extent === '' || isNaN(Number(extent))) { bad.push(idx + 1); return; }
          out.push({ plotNo: plotNo, extent: Number(extent), price: (price !== '' && !isNaN(Number(price))) ? Number(price) : null });
        });
        return { rows: out, badLines: bad };
      }

      function refreshPreview() {
        var parsed = parseRows();
        var cEl = $('#bCount');
        cEl.className = 'bulk-count' + (parsed.badLines.length ? ' warn' : '');
        cEl.textContent = parsed.rows.length + ' பிளாட்கள் தயார்' + (parsed.badLines.length ? (' — வரி ' + parsed.badLines.join(', ') + ' தவறாக உள்ளது (Plot No / பரப்பளவு விட்டுவிடாதீர்கள் அல்லது இயல்பு பரப்பளவு நிரப்பவும்)') : '');
        var wrap = $('#bPreviewWrap'), body = $('#bPreviewBody');
        if (!parsed.rows.length) { wrap.style.display = 'none'; return; }
        wrap.style.display = 'block';
        body.innerHTML = parsed.rows.slice(0, 30).map(function (r) {
          return '<tr><td>' + esc(r.plotNo) + '</td><td>' + esc(r.extent) + '</td><td>' + (r.price != null ? esc(r.price) : '—') + '</td></tr>';
        }).join('') + (parsed.rows.length > 30 ? '<tr><td colspan="3" style="color:#8a94a1;">… மேலும் ' + (parsed.rows.length - 30) + ' பிளாட்கள்</td></tr>' : '');
        return parsed;
      }
      ['bRows', 'bDefExtent', 'bDefPrice'].forEach(function (id) { $('#' + id).addEventListener('input', refreshPreview); });

      $('#bf').addEventListener('submit', function (e) {
        e.preventDefault();
        $('#bmsg').textContent = '';
        var district = $('#bDistrict').value, layoutName = $('#bLayoutName').value.trim();
        if (!district) { $('#bmsg').textContent = 'மாவட்டத்தை தேர்வு செய்யவும் (Property ID உருவாக்க தேவை).'; return; }
        if (!layoutName) { $('#bmsg').textContent = 'Layout பெயரை நிரப்பவும்.'; return; }
        var parsed = parseRows();
        if (!parsed.rows.length) { $('#bmsg').textContent = 'குறைந்தது ஒரு பிளாட் தகவலாவது பட்டியலில் இருக்க வேண்டும்.'; return; }
        if (parsed.badLines.length) { $('#bmsg').textContent = 'சில வரிகளில் பிழை உள்ளது — சரி செய்த பின் மீண்டும் முயற்சிக்கவும் (மேலே சிவப்பில் காட்டப்பட்ட வரி எண்களை பார்க்கவும்).'; return; }

        var common = {
          district: district,
          taluk: $('#bTaluk').value || null,
          village: $('#bVillage').value.trim() || null,
          location_landmark: $('#bLandmark').value.trim() || null,
          layout_name: layoutName,
          property_type: 'Plot / Layout',
          land_type: $('#bLandType').value || null,
          layout_amenities: (function () { var a = $('#bAmenities').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); return a.length ? a : null; })(),
          road_access: $('#bRoadAccess').value || null,
          road_width: $('#bRoadWidth').value ? Number($('#bRoadWidth').value) : null,
          patta_status: $('#bPatta').value || null,
          ec_status: $('#bEc').value || null,
          approval_status: $('#bApproval').value || null,
          litigation_flag: $('#bLitigation').value || null,
          property_status: $('#bStatus').value || 'Listed',
          source: $('#bSource').value || null,
          highlight_icon: $('#bHighlight').value || null,
          owner_id: $('#bOwnerId').value.trim() || null,
          extent_unit: $('#bExtUnit').value || 'Sq.ft',
          created_date: new Date().toISOString().slice(0, 10)
        };

        var saveBtn = $('#bSaveBtn'); saveBtn.disabled = true; saveBtn.textContent = 'ஐடி உருவாக்குகிறது...';
        var code = districtCode(district), prefix = 'PROP-' + code + '-';
        sb.from('properties').select('property_id').ilike('property_id', prefix + '%').range(0, 4999).then(function (r) {
          if (r.error) { saveBtn.disabled = false; saveBtn.textContent = 'எல்லாம் சேமி'; $('#bmsg').textContent = r.error.message; return; }
          var max = 0, re = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\d+)$');
          (r.data || []).forEach(function (x) { var m = String(x.property_id).match(re); if (m) { var n = parseInt(m[1], 10); if (n > max) max = n; } });

          var payloadRows = parsed.rows.map(function (row, i) {
            var id = prefix + String(max + 1 + i).padStart(4, '0');
            var p = {};
            Object.keys(common).forEach(function (k) { p[k] = common[k]; });
            p.property_id = id;
            p.survey_no = row.plotNo;
            p.extent = row.extent;
            p.asking_price = row.price;
            return p;
          });

          var CHUNK = 150, chunks = [];
          for (var i = 0; i < payloadRows.length; i += CHUNK) chunks.push(payloadRows.slice(i, i + CHUNK));
          var done = 0;
          function insertNext(idx) {
            if (idx >= chunks.length) {
              root.innerHTML = '';
              toast(payloadRows.length + ' பிளாட்கள் சேமிக்கப்பட்டன ✔');
              openTab('properties');
              return;
            }
            saveBtn.textContent = 'சேமிக்கிறது... (' + done + ' / ' + payloadRows.length + ')';
            sb.from('properties').insert(chunks[idx]).then(function (res) {
              if (res.error) {
                saveBtn.disabled = false; saveBtn.textContent = 'எல்லாம் சேமி';
                $('#bmsg').textContent = done + ' பிளாட்கள் சேமிக்கப்பட்டன, பிறகு பிழை: ' + res.error.message + ' — மீதமுள்ளவற்றை மீண்டும் முயற்சிக்கவும் (ஏற்கனவே சேமிக்கப்பட்ட Plot No-க்களை பட்டியலிலிருந்து நீக்கிவிட்டு).';
                return;
              }
              done += chunks[idx].length;
              insertNext(idx + 1);
            });
          }
          insertNext(0);
        });
      });

      refreshPreview();
    });
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('#modalRoot').innerHTML = ''; });
})();
</script>
</body>
</html>
